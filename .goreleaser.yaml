version: 2

project_name: dockwhy

builds:
  - id: dockwhy
    main: ./cmd/dockwhy
    binary: dockwhy
    ldflags:
      - -s -w -X github.com/prabhnoor12/dockwhy/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

brews:
  - name: dockwhy
    repository:
      owner: prabhnoor12
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/prabhnoor12/dockwhy"
    description: "Explain why a Docker container stopped"
    license: "Apache-2.0"
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_TOKEN "" }}true{{ else }}false{{ end }}'
    test: |
      system "#{bin}/dockwhy", "--version"
    install: |
      bin.install "dockwhy"

scoops:
  - name: dockwhy
    repository:
      owner: prabhnoor12
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/prabhnoor12/dockwhy"
    description: "Explain why a Docker container stopped"
    license: "Apache-2.0"
    skip_upload: '{{ if eq .Env.SCOOP_BUCKET_TOKEN "" }}true{{ else }}false{{ end }}'

checksum:
  name_template: checksums.txt

snapshot:
  name_template: "{{ incpatch .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
